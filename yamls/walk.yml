name: envs

languages:
  - name: go
    extensions: [".go"]

  - name: python
    extensions: [".py"]

  - name: javascript
    extensions: [".js", ".jsx", ".mjs", ".cjs"]

  - name: typescript
    extensions: [".ts", ".tsx"]

  - name: rust
    extensions: [".rs"]

  - name: ruby
    extensions: [".rb"]

  - name: java
    extensions: [".java"]

  - name: kotlin
    extensions: [".kt", ".kts"]

  - name: php
    extensions: [".php"]

  - name: shell
    extensions: [".sh", ".bash", ".zsh"]

ignored_dirs:
  - .git
  - node_modules
  - vendor
  - dist
  - build
  - .next
  - .nuxt
  - target
  - coverage
  - __pycache__
  - .venv
  - venv

# Tests can contain realistic route declarations, but they are not production
# endpoints and must not become Nginx allowlist entries or service candidates.
ignored_files:
  - "*_test.go"
  - "test_*.py"
  - "*_test.py"
  - "*.test.js"
  - "*.test.ts"
  - "*.spec.js"
  - "*.spec.ts"

scan_files:
  - ".env"
  - ".env.*"
  - "Dockerfile"
  - "docker-compose.yml"
  - "docker-compose.yaml"
  - "compose.yml"
  - "compose.yaml"

scan_extensions:
  - ".yml"
  - ".yaml"
  - ".json"
  - ".toml"

# Dockerfile discovery is repository-wide and case-insensitive. The selected
# production file is stored per project by the deploy command.
dockerfiles:
  - Dockerfile
  - Dockerfile.*
  - Dockerfile-*
  - "*.Dockerfile"

# These rules identify possible backend entrypoints. A filename is enough to
# list a low-confidence candidate; a nearby manifest and server marker raise
# confidence. Detection never deploys a service without user configuration.
service_rules:
  - name: python-backend
    runtime: python
    files: [main.py, app.py, server.py, manage.py, asgi.py, wsgi.py]
    manifests: [pyproject.toml, requirements.txt, Pipfile, setup.py]
    markers:
      - "FastAPI("
      - "Flask("
      - "uvicorn.run("
      - "app.run("
      - "DJANGO_SETTINGS_MODULE"
      - "get_wsgi_application("
      - "get_asgi_application("
      - "HTTPServer("

  - name: go-backend
    runtime: go
    files: [main.go]
    manifests: [go.mod]
    markers:
      - "http.ListenAndServe("
      - "http.ListenAndServeTLS("
      - "grpc.NewServer("
      - "gin.Default("
      - "gin.New("
      - "echo.New("
      - "fiber.New("

  - name: node-backend
    runtime: node
    files: [server.js, server.mjs, server.cjs, server.ts, app.js, app.mjs, app.cjs, app.ts, index.js, index.mjs, index.cjs, index.ts, main.js, main.ts]
    manifests: [package.json]
    markers:
      - "express("
      - "fastify("
      - "createServer("
      - ".listen("
      - "NestFactory.create("
      - "new Koa("
      - "new Hapi.Server("

# Route rules use named method/path captures; prefix rules use var/prefix and
# optionally receiver. They intentionally cover EZDeploy's current runtimes.
route_methods: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS]

prefix_rules:
  - name: go-router-group
    language: go
    pattern: '(?P<var>\w+)\s*:=\s*(?P<receiver>\w+)\.Group\(\s*["`](?P<prefix>/[^"`\s]+)'
  - name: express-router-mount
    languages: [javascript, typescript]
    pattern: '(?P<receiver>\w+)\.use\(\s*["`](?P<prefix>/[^"`\s]+)["`]\s*,\s*(?P<var>\w+)'
  - name: fastapi-router-prefix
    language: python
    pattern: '(?P<var>\w+)\s*=\s*APIRouter\([^)]*prefix\s*=\s*["`](?P<prefix>/[^"`\s]+)'

route_rules:
  - name: dot-method
    languages: [go, javascript, typescript]
    pattern: '(?P<receiver>\w+)\.(?P<method>METHOD)\s*\(\s*["`](?P<path>(?:/[^"`\s]*)?)["`]'
  - name: python-decorator
    language: python
    pattern: '@(?P<receiver>\w+)\.(?P<method>METHOD)\s*\(\s*["`](?P<path>/[^"`\s]+)'
  - name: flask-route
    language: python
    pattern: '@(?P<receiver>\w+)\.route\(\s*["`](?P<path>/[^"`\s]+)["`][^)]*methods\s*=\s*\[(?P<method>[^\]]+)\]'
    multi: true
  - name: go-servemux
    language: go
    pattern: '"(?P<method>GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)\s+(?P<path>/[^"]+)"'
  - name: go-gorilla-methods
    language: go
    pattern: '\.HandleFunc\s*\(\s*["`](?P<path>/[^"`\s]+)["`][^)]*\)\.Methods\s*\(\s*["`](?P<method>METHOD)["`]'

env_rules:
  - name: env-file-key
    files: [".env", ".env.*"]
    pattern: '^\s*(?:export\s+)?(?P<name>[A-Za-z_][A-Za-z0-9_]*)\s*='

  - name: go-os-getenv
    language: go
    pattern: '\bos\.(?:Getenv|LookupEnv)\(\s*["`](?P<name>[A-Za-z_][A-Za-z0-9_]*)["`]\s*\)'

  - name: python-os-getenv
    language: python
    pattern: '\bos\.getenv\(\s*["`](?P<name>[A-Za-z_][A-Za-z0-9_]*)["`]'

  - name: python-os-environ-index
    language: python
    pattern: '\bos\.environ\[\s*["`](?P<name>[A-Za-z_][A-Za-z0-9_]*)["`]\s*\]'

  - name: python-os-environ-get
    language: python
    pattern: '\bos\.environ\.get\(\s*["`](?P<name>[A-Za-z_][A-Za-z0-9_]*)["`]'

  - name: node-process-env-dot
    language: javascript
    pattern: '\bprocess\.env\.(?P<name>[A-Za-z_][A-Za-z0-9_]*)'

  - name: node-process-env-index
    language: javascript
    pattern: '\bprocess\.env\[\s*["`](?P<name>[A-Za-z_][A-Za-z0-9_]*)["`]\s*\]'

  - name: ts-process-env-dot
    language: typescript
    pattern: '\bprocess\.env\.(?P<name>[A-Za-z_][A-Za-z0-9_]*)'

  - name: ts-process-env-index
    language: typescript
    pattern: '\bprocess\.env\[\s*["`](?P<name>[A-Za-z_][A-Za-z0-9_]*)["`]\s*\]'

  - name: vite-import-meta-env
    languages: [javascript, typescript]
    pattern: '\bimport\.meta\.env\.(?P<name>[A-Za-z_][A-Za-z0-9_]*)'

  - name: deno-env-get
    languages: [javascript, typescript]
    pattern: '\bDeno\.env\.get\(\s*["`](?P<name>[A-Za-z_][A-Za-z0-9_]*)["`]\s*\)'

  - name: rust-env-var
    language: rust
    pattern: '\b(?:std::)?env::var\(\s*["`](?P<name>[A-Za-z_][A-Za-z0-9_]*)["`]\s*\)'

  - name: ruby-env-index
    language: ruby
    pattern: '\bENV\[\s*["`](?P<name>[A-Za-z_][A-Za-z0-9_]*)["`]\s*\]'

  - name: ruby-env-fetch
    language: ruby
    pattern: '\bENV\.fetch\(\s*["`](?P<name>[A-Za-z_][A-Za-z0-9_]*)["`]'

  - name: jvm-system-getenv
    languages: [java, kotlin]
    pattern: '\bSystem\.getenv\(\s*["`](?P<name>[A-Za-z_][A-Za-z0-9_]*)["`]\s*\)'

  - name: php-getenv
    language: php
    pattern: '\bgetenv\(\s*["`](?P<name>[A-Za-z_][A-Za-z0-9_]*)["`]\s*\)'

  - name: php-env-superglobal
    language: php
    pattern: '\$_ENV\[\s*["`](?P<name>[A-Za-z_][A-Za-z0-9_]*)["`]\s*\]'

  - name: config-env-interpolation
    extensions: [".yml", ".yaml", ".json", ".toml"]
    files:
      - Dockerfile
      - Dockerfile.*
      - Dockerfile-*
      - "*.Dockerfile"
      - docker-compose.yml
      - docker-compose.yaml
      - compose.yml
      - compose.yaml
    pattern: '\$\{(?P<name>[A-Za-z_][A-Za-z0-9_]*)(?:[:?][-?][^}]*)?\}'
